<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivilNotes - BTEC Civil Engineering Notes &amp; Portfolios</title>
    <meta name="description" content="Specialist Pearson BTEC Level 3, HNC &amp; HND Civil Engineering resource portal with unit portfolios, distinction exemplars, and coursework toolkits." />
    <meta property="og:title" content="CivilNotes - BTEC Civil Engineering Notes &amp; Portfolios" />
    <meta property="og:description" content="Specialist Pearson BTEC Level 3, HNC &amp; HND Civil Engineering resource portal with unit portfolios, distinction exemplars, and coursework toolkits." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- High-fidelity instant shell to prevent any white-screen flashes -->
      <div style="min-height: 100vh; background-color: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; font-family: system-ui, -apple-system, sans-serif;">
        <div style="background: white; border-radius: 20px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; max-width: 360px; width: 100%; text-align: center;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #185a36; color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; font-weight: 800; font-size: 18px;">
            CN
          </div>
          <div style="font-size: 17px; font-weight: 800; color: #0f172a; margin-bottom: 4px;">CivilNotes</div>
          <div style="font-size: 11px; font-weight: 700; color: #185a36; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;">BTEC Civil Engineering</div>
          <div id="loading-status-text" style="font-size: 12px; color: #64748b; line-height: 1.5;">Loading Unit Portfolios, Distinction Exemplars &amp; Coursework Notes...</div>
          <div id="boot-error" style="display:none; margin-top:14px; padding:10px; background:#fef2f2; border:1px solid #fecaca; border-radius:10px; font-size:11px; color:#b91c1c; text-align:left; word-break:break-all; font-family:monospace;"></div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('boot-error');
        if (el) {
          el.style.display = 'block';
          var msg = e.message || (e.target && e.target.src ? 'Failed to fetch: ' + e.target.src : String(e));
          el.textContent = 'App Init Error: ' + msg;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('boot-error');
        if (el) {
          el.style.display = 'block';
          var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejected';
          el.textContent = 'Promise Error: ' + reason;
        }
      });
    </script>
    <script type="module">
      var isStaticOrGitHubPages = window.location.hostname.endsWith('github.io') || 
                                  window.location.protocol === 'file:' || 
                                  !window.location.port;

      if (isStaticOrGitHubPages) {
        loadStaticBundle();
      } else {
        // Dev server mode (e.g. AI Studio on port 3000)
        import('./src/main.tsx').catch(function(err) {
          console.warn('Dev import failed, switching to pre-bundled assets', err);
          loadStaticBundle();
        });
      }

      function loadStaticBundle() {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.crossOrigin = '';
        link.href = './assets/index.css';
        document.head.appendChild(link);

        var script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = '';
        script.src = './assets/index.js';
        script.onerror = function() {
          var errEl = document.getElementById('boot-error');
          if (errEl) {
            errEl.style.display = 'block';
            errEl.textContent = 'GitHub Pages Note: ./assets/index.js was not found. Please ensure the assets folder is in your repo or deploy the dist folder.';
          }
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
