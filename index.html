<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivilNotes - BTEC Civil Engineering Notes &amp; Portfolios</title>
    <meta name="description" content="Specialist Pearson BTEC Level 3, HNC &amp; HND Civil Engineering resource portal with unit portfolios, distinction exemplars, and coursework toolkits." />
    <meta property="og:title" content="CivilNotes - BTEC Civil Engineering Notes &amp; Portfolios" />
    <meta property="og:description" content="Specialist Pearson BTEC Level 3, HNC &amp; HND Civil Engineering resource portal with unit portfolios, distinction exemplars, and coursework toolkits." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #071626;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes cnProgressPulse {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(50%); }
        100% { transform: translateX(200%); }
      }
    </style>
    <script>
      window.addEventListener('error', function(event) {
        var el = document.getElementById('init-error-msg');
        if (el) {
          el.style.display = 'block';
          el.textContent = 'App Init Error: ' + (event.message || 'Script resource unavailable. Tap to refresh.');
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('init-error-msg');
        if (el) {
          el.style.display = 'block';
          el.textContent = 'App Init Error: ' + (event.reason ? (event.reason.message || event.reason) : 'Async rejected. Tap to refresh.');
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant pre-hydration card prevents blank white page while bundle loads -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #071626; padding: 20px; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #f8fafc;">
        <div style="background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(51, 65, 85, 0.8); border-radius: 24px; padding: 32px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
          <div style="width: 60px; height: 60px; background: #185a36; border-radius: 18px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #ffffff; box-shadow: 0 10px 15px -3px rgba(24, 90, 54, 0.4);">
            CN
          </div>
          <h1 style="font-size: 20px; font-weight: 800; margin: 0 0 4px; color: #ffffff; letter-spacing: -0.02em;">
            CivilNotes
          </h1>
          <div style="font-size: 11px; font-weight: 700; color: #34d399; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;">
            BTEC Civil Engineering
          </div>
          <p style="font-size: 12px; color: #94a3b8; line-height: 1.5; margin: 0 0 20px;">
            Loading Unit Portfolios, Distinction Exemplars &amp; Coursework Notes...
          </p>
          <div style="width: 100%; height: 4px; background: #1e293b; border-radius: 9999px; overflow: hidden; margin-bottom: 20px; position: relative;">
            <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); border-radius: 9999px; animation: cnProgressPulse 1.2s infinite ease-in-out;"></div>
          </div>
          <div id="init-error-msg" style="display: none; background: rgba(225, 29, 72, 0.15); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: 12px; padding: 10px; font-size: 11px; color: #fca5a5; font-family: monospace; text-align: left; margin-bottom: 14px;"></div>
          <button onclick="window.location.reload()" style="background: #185a36; color: white; border: none; padding: 10px 20px; font-size: 12px; font-weight: 700; border-radius: 12px; cursor: pointer;">
            Tap to Refresh
          </button>
        </div>
      </div>
    </div>
    <!-- Universal CivilNotes Loader: Supports Vite Dev Server & Static GitHub Pages -->
    <script type="module">
      (function() {
        var isViteDev = Boolean(
          window.__vite_plugin_react_preamble_installed__ ||
          location.port === '3000' ||
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname.includes('.run.app')
        );

        if (isViteDev) {
          import('/src/main.tsx').catch(function(err) {
            console.warn('Vite dev import failed, trying compiled bundle:', err);
            loadProductionBundle();
          });
        } else {
          loadProductionBundle();
        }

        function loadProductionBundle() {
          if (!document.querySelector('link[href*="app.css"]')) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './assets/app.css';
            document.head.appendChild(link);
          }

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/app.js';
          script.onerror = function() {
            var fallback = document.createElement('script');
            fallback.type = 'module';
            fallback.crossOrigin = 'anonymous';
            fallback.src = './assets/main.js';
            document.body.appendChild(fallback);
          };
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
